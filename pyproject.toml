[project]
name = "reserves-uploader"
version = "0.0.0"
description = "Uploads reserve files and arranges them in filename-based directories."
readme = "README.md"
requires-python = "==3.8.10"
dependencies = [
    "asgiref==3.5.2",
    "async-generator==1.10",
    "attrs==22.1.0",
    "certifi==2026.10.23",
    "charset-normalizer==2.1.1",
    "Django==3.2.16",
    "exceptiongroup==1.0.4",
    "idna==3.4",
    "outcome==1.2.0",
    "python-dotenv==1.0.1",
    "pytz==2022.2.1",
    "requests==2.28.1",
    "sniffio==1.3.0",
    "sortedcontainers==2.4.0",
    "sqlparse==0.4.2",
    "trio==0.22.0",
    "urllib3==1.26.13",
]

[dependency-groups]
local = []
staging = ["mysqlclient==2.1.1"]
prod = ["mysqlclient==2.1.1"]
